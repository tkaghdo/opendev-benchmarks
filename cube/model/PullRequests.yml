cubes:
  - name: pull_requests
    sql_table: public.pull_requests
    joins:
      - name: orgs
        sql: "{CUBE}.org_id = {orgs.id}"
        relationship: many_to_one
      - name: repos
        sql: "{CUBE}.repo_id = {repos.id}"
        relationship: many_to_one
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: orgId
        sql: org_id
        type: string
      - name: repoId
        sql: repo_id
        type: number
      - name: authorId
        sql: author_id
        type: number
      - name: state
        sql: state
        type: string
      - name: createdAt
        sql: created_at
        type: time
      - name: mergedAt
        sql: merged_at
        type: time
      - name: firstReviewAt
        sql: first_review_at
        type: time
    measures:
      - name: count
        type: count
      - name: merged_count
        type: count
        filters:
          - sql: "{CUBE}.merged_at is not null"
      - name: avg_cycle_time_hours
        sql: "extract(epoch from ({CUBE}.merged_at - {CUBE}.created_at)) / 3600.0"
        type: avg
        filters:
          - sql: "{CUBE}.merged_at is not null"
      - name: median_cycle_time_hours
        sql: "percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch from ({CUBE}.merged_at - {CUBE}.created_at)) / 3600.0) FILTER (WHERE {CUBE}.merged_at is not null)"
        type: number
        title: Median PR cycle time (hours)
      - name: avg_time_to_first_review_hours
        sql: "extract(epoch from ({CUBE}.first_review_at - {CUBE}.created_at)) / 3600.0"
        type: avg
        filters:
          - sql: "{CUBE}.first_review_at is not null"
      - name: median_time_to_first_review_hours
        sql: "percentile_cont(0.5) WITHIN GROUP (ORDER BY extract(epoch from ({CUBE}.first_review_at - {CUBE}.created_at)) / 3600.0) FILTER (WHERE {CUBE}.first_review_at is not null)"
        type: number
        title: Median time to first review (hours)
      - name: avg_pr_size
        sql: "coalesce({CUBE}.additions, 0) + coalesce({CUBE}.deletions, 0)"
        type: avg
      - name: active_contributors
        sql: "{CUBE}.author_id"
        type: count_distinct
        title: Distinct PR authors
      - name: prs_per_active_contributor
        sql: "{merged_count} / nullif({active_contributors}, 0)"
        type: number
    refreshKey:
      sql: SELECT MAX(finished_at) FROM public.ingestion_runs
    preAggregations:
      - name: prs_daily
        measures:
          - count
          - merged_count
          - avg_cycle_time_hours
          - avg_time_to_first_review_hours
          - avg_pr_size
          - active_contributors
        dimensions:
          - orgId
          - repoId
        timeDimension: createdAt
        granularity: day
        partitionGranularity: month
        external: false
        scheduledRefresh: true
        refreshKey:
          every: 2 hour
