cubes:
  - name: orgs
    sql_table: public.orgs
    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: orgId
        sql: id
        type: string
      - name: name
        sql: name
        type: string
      - name: githubLogin
        sql: github_login
        type: string
    measures:
      - name: count
        type: count
